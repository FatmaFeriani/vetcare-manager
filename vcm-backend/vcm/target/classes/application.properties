# Application
spring.application.name=vcm
server.port=${PORT:8087}

# PostgreSQL. Set JDBC_DATABASE_URL, DB_USERNAME, and DB_PASSWORD in Render.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/vcm_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:VetCareManagerSecretKey2024ForJWTAuthenticationVeryLongAndSecureKey1234567890}
jwt.expiration=86400000

# Mail (configure with real SMTP for production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=votre.email@gmail.com
spring.mail.password=votre-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin email for notifications
app.admin.email=admin@pethealth.com

# File upload (for photos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
