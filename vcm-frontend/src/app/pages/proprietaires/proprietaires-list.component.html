<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="page-title">Propriétaires</h1>
    <p class="page-subtitle">Gestion des propriétaires d'animaux</p>
  </div>
  <a routerLink="/proprietaires/nouveau" class="btn btn-primary">
    <i class="bi bi-plus-lg me-1"></i> Ajouter
  </a>
</div>

<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>Liste des propriétaires</span>
    <div class="input-group" style="max-width:280px;">
      <input type="text" class="form-control form-control-sm" placeholder="Rechercher..."
             [(ngModel)]="search" (keyup.enter)="onSearch()">
      <button class="btn btn-sm btn-outline-secondary" (click)="onSearch()">
        <i class="bi bi-search"></i>
      </button>
    </div>
  </div>
  <div class="card-body p-0">
    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary"></div>
    </div>
    <div *ngIf="!loading && page && page.content.length === 0" class="empty-state">
      <i class="bi bi-people"></i>
      <p>Aucun propriétaire trouvé</p>
    </div>
    <table class="table table-hover mb-0" *ngIf="!loading && page && page.content.length > 0">
      <thead>
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Téléphone</th>
          <th>Email</th>
          <th>Activité</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of page.content">
          <td>{{ p.id }}</td>
          <td class="fw-semibold">{{ p.nom }}</td>
          <td>{{ p.telephone }}</td>
          <td>{{ p.email }}</td>
          <td>{{ p.activite || '—' }}</td>
          <td class="text-end">
            <a [routerLink]="['/proprietaires', p.id]" class="btn btn-sm btn-outline-info me-1" title="Détail">
              <i class="bi bi-eye"></i>
            </a>
            <a *ngIf="auth.isAdmin()" [routerLink]="['/proprietaires', p.id, 'edit']"
               class="btn btn-sm btn-outline-primary me-1" title="Modifier">
              <i class="bi bi-pencil"></i>
            </a>
            <button *ngIf="auth.isAdmin()" class="btn btn-sm btn-outline-danger" (click)="delete(p.id!)" title="Supprimer">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="card-footer d-flex justify-content-between align-items-center" *ngIf="page && page.totalPages > 1">
    <small class="text-muted">{{ page.totalElements }} résultat(s)</small>
    <nav>
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="page.first">
          <a class="page-link" (click)="goToPage(currentPage - 1)">&laquo;</a>
        </li>
        <li class="page-item" *ngFor="let i of [].constructor(page.totalPages); let idx = index"
            [class.active]="idx === currentPage">
          <a class="page-link" (click)="goToPage(idx)">{{ idx + 1 }}</a>
        </li>
        <li class="page-item" [class.disabled]="page.last">
          <a class="page-link" (click)="goToPage(currentPage + 1)">&raquo;</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
