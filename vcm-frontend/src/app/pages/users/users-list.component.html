<div class="mb-4">
  <h1 class="page-title">Utilisateurs</h1>
  <p class="page-subtitle">Gestion des comptes (ADMIN uniquement)</p>
</div>

<div class="card">
  <div class="card-header">Liste des utilisateurs</div>
  <div class="card-body p-0">
    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary"></div>
    </div>
    <table class="table table-hover mb-0" *ngIf="!loading">
      <thead>
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Téléphone</th>
          <th>Rôles</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of users">
          <td>{{ u.id }}</td>
          <td class="fw-semibold">{{ u.prenom }} {{ u.nom }}</td>
          <td>{{ u.login }}</td>
          <td>{{ u.tel || '—' }}</td>
          <td>
            <span *ngFor="let r of u.roles" class="badge badge-role me-1"
                  [class.bg-primary]="r.includes('ADMIN')"
                  [class.bg-secondary]="!r.includes('ADMIN')">
              {{ r.replace('ROLE_', '') }}
            </span>
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-danger" (click)="delete(u.id)"
                    [disabled]="u.id === auth.getCurrentUser()?.id">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
